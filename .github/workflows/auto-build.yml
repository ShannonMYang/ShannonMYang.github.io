name: Auto build site

# 在 GitHub 网页上直接改 Markdown 时，也能自动重建静态页面。
# 写作台本地发布时会先构建再推送，所以这个工作流通常无需再提交任何东西。
on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "theme/**"
      - "site/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Commit rebuilt output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "构建产物没有变化，无需提交。"
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi
